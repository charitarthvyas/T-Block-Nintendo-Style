<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformations Master - Block Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e2e8f0; /* Soft slate background */
            background-image: radial-gradient(#cbd5e1 1px, transparent 0);
            background-size: 20px 20px;
            color: #0f172a;
            overflow-x: hidden;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tactile Gamepad Buttons */
        .btn-game {
            position: relative;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(0);
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
        }
        .btn-game:disabled {
            filter: grayscale(100%) opacity(50%);
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
        }

        .btn-blue {
            background-color: #0ea5e9;
            box-shadow: 0 6px 0 0 #0284c7, 0 10px 15px -3px rgba(14, 165, 233, 0.4);
            color: white;
        }
        .btn-blue:hover:not(:disabled) { background-color: #38bdf8; }

        .btn-green {
            background-color: #22c55e;
            box-shadow: 0 6px 0 0 #16a34a, 0 10px 15px -3px rgba(34, 197, 94, 0.4);
            color: white;
        }
        .btn-green:hover:not(:disabled) { background-color: #4ade80; }

        .btn-red {
            background-color: #ef4444;
            box-shadow: 0 6px 0 0 #dc2626, 0 10px 15px -3px rgba(239, 68, 68, 0.4);
            color: white;
        }
        .btn-red:hover:not(:disabled) { background-color: #f87171; }

        /* Canvas Container Styling */
        .canvas-wrapper {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 
                0 0 0 8px rgba(255, 255, 255, 0.5),
                0 25px 50px -12px rgba(0, 0, 0, 0.15),
                inset 0 0 0 2px #e2e8f0;
            padding: 16px;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background-color: #ffffff;
            touch-action: none;
        }

        /* UI Panel Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-[1400px] w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left: Canvas Area (8 columns) -->
        <div class="lg:col-span-8 flex flex-col gap-4">
            <div class="flex justify-between items-end px-2">
                <div>
                    <div class="inline-block bg-sky-100 text-sky-700 font-black tracking-wider text-xs px-3 py-1 rounded-full mb-2 uppercase">Level 1: The Gap</div>
                    <h1 class="text-3xl md:text-4xl font-black text-slate-800 tracking-tight" style="text-shadow: 2px 2px 0px white;">
                        Transformation <span class="text-sky-500">Engine</span>
                    </h1>
                </div>
                <div class="hidden sm:block text-right">
                    <span class="block text-sm font-bold text-slate-500 uppercase tracking-widest">Time Penalty</span>
                    <span id="ui-timer" class="text-3xl font-black text-rose-500 mono drop-shadow-sm">0s</span>
                </div>
            </div>

            <div class="canvas-wrapper aspect-square w-full max-h-[75vh]">
                <canvas id="gameCanvas"></canvas>
            </div>
        </div>

        <!-- Right: Control Dashboard (4 columns) -->
        <div class="lg:col-span-4 flex flex-col gap-6 lg:mt-16">
            
            <!-- Dashboard Card -->
            <div class="glass-panel p-6 flex flex-col gap-6">
                
                <div class="bg-slate-50 border-2 border-slate-100 rounded-xl p-4 shadow-inner">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Target Objective</h2>
                    <p class="text-slate-700 font-semibold leading-relaxed">
                        Navigate the blue T-Block into the green <span class="font-black text-emerald-500">Landing Gap</span>. The yellow center <span class="font-black mono text-amber-500 bg-amber-50 px-1 rounded">B</span> is your fixed mechanical pivot.
                    </p>
                </div>

                <div>
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Command Sequence</h2>
                    <div class="flex flex-col gap-4">
                        <button id="btn-step1" class="btn-game btn-blue font-bold text-lg py-4 px-6 rounded-2xl flex justify-between items-center group">
                            <span>1. Shift Right</span>
                            <span class="mono bg-white/20 px-2 py-1 rounded-lg text-sm drop-shadow-sm">T(+5, 0)</span>
                        </button>
                        
                        <button id="btn-step2" class="btn-game btn-blue font-bold text-lg py-4 px-6 rounded-2xl flex justify-between items-center group" disabled>
                            <span>2. Rotate 180°</span>
                            <span class="mono bg-white/20 px-2 py-1 rounded-lg text-sm drop-shadow-sm">↺ @ B</span>
                        </button>
                        
                        <button id="btn-step3" class="btn-game btn-blue font-bold text-lg py-4 px-6 rounded-2xl flex justify-between items-center group" disabled>
                            <span>3. Drop Down</span>
                            <span class="mono bg-white/20 px-2 py-1 rounded-lg text-sm drop-shadow-sm">T(0, -9)</span>
                        </button>
                    </div>
                </div>

                <hr class="border-slate-200 border-2 rounded-full">

                <div class="grid grid-cols-2 gap-4">
                    <button id="btn-auto" class="btn-game btn-green font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Auto Play
                    </button>
                    <button id="btn-reset" class="btn-game btn-red font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Reset
                    </button>
                </div>

            </div>
            
            <!-- Telemetry Box -->
            <div class="glass-panel p-4 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Pivot (B) Loc:</span>
                <span id="ui-coords" class="mono text-2xl font-black text-slate-700">(4.0, 12.0)</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Physics Settings
        const GRID_SIZE = 16;
        let CELL_SIZE;

        // Block Composition (Relative to Pivot B)
        const PIECES = [
            { id: 'B', ox: 0, oy: 0 }, // Pivot
            { id: 'A', ox: -2, oy: 0 }, // Note: A is at 6,12. B is 4,12. So A is +2X. Wait.
            // Let's explicitly define coordinates from the prompt.
            // A(6,12), B(4,12), C(2,12), D(4,14). B is origin (0,0)
            // A is +2x. C is -2x. D is +2y.
        ];
        
        // Corrected Relative Offsets (1 unit = 1 grid square)
        const BLOCKS = [
            { id: 'B', x: 0, y: 0 },   // Pivot Center
            { id: 'A', x: 2, y: 0 },   // Right of Pivot
            { id: 'C', x: -2, y: 0 },  // Left of Pivot
            { id: 'D', x: 0, y: 2 }    // Above Pivot
        ];

        // State Machine
        let state = {
            x: 4,
            y: 12,
            angle: 0,
            time: 0
        };

        let startState = { ...state };
        let targetState = { ...state };
        let isAnimating = false;
        let animProgress = 0;
        let currentSequence = 0; // 0=Idle, 1=T(+5,0), 2=Rot180, 3=T(0,-9)
        let pathHistory = [{x: 4, y: 12}];

        function resizeCanvas() {
            // Get actual dimensions of the CSS box
            const rect = canvas.parentElement.getBoundingClientRect();
            // Get pixel ratio (High DPI screens)
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = (rect.width - 32) * dpr; // -32 for container padding
            canvas.height = (rect.height - 32) * dpr;
            
            ctx.scale(dpr, dpr);
            
            // Calculate square grid layout centered in canvas
            const minDim = Math.min(rect.width - 32, rect.height - 32);
            CELL_SIZE = minDim / GRID_SIZE;
            
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        // Map Cartesian (Math) Coordinates to Canvas (Pixel) Coordinates
        function getPx(cx, cy) {
            // cy is inverted because canvas Y goes down, math Y goes up
            return {
                x: cx * CELL_SIZE,
                y: (GRID_SIZE - cy) * CELL_SIZE
            };
        }

        // Fluid Easing Function (Cubic In-Out)
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Minor Grid (Every 1 unit)
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#e2e8f0'; // Light slate
            for (let i = 0; i <= GRID_SIZE; i++) {
                const p1 = getPx(i, 0); const p2 = getPx(i, GRID_SIZE);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                const p3 = getPx(0, i); const p4 = getPx(GRID_SIZE, i);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            // Major Grid (Every 2 units)
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#cbd5e1'; // Darker slate
            for (let i = 0; i <= GRID_SIZE; i += 2) {
                const p1 = getPx(i, 0); const p2 = getPx(i, GRID_SIZE);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                const p3 = getPx(0, i); const p4 = getPx(GRID_SIZE, i);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            // Thick Axes
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#334155'; // Dark slate for axes
            const origin = getPx(0, 0);
            const xMax = getPx(GRID_SIZE, 0);
            const yMax = getPx(0, GRID_SIZE);
            
            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(xMax.x, xMax.y); ctx.stroke(); // X Axis
            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(yMax.x, yMax.y); ctx.stroke(); // Y Axis

            // Axis Labels (Blueprint Style with heavy halo)
            ctx.font = '800 13px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff'; // White halo
            ctx.fillStyle = '#0f172a'; // Dark text

            for (let i = 2; i <= GRID_SIZE; i += 2) {
                const ptX = getPx(i, 0);
                // X labels slightly below line
                ctx.strokeText(i, ptX.x, ptX.y + 16);
                ctx.fillText(i, ptX.x, ptX.y + 16);
                
                const ptY = getPx(0, i);
                // Y labels slightly left of line
                ctx.strokeText(i, ptY.x - 16, ptY.y);
                ctx.fillText(i, ptY.x - 16, ptY.y);
            }
        }

        function createHatchPattern() {
            const hatchCanvas = document.createElement('canvas');
            hatchCanvas.width = 16;
            hatchCanvas.height = 16;
            const hCtx = hatchCanvas.getContext('2d');
            
            // Base color
            hCtx.fillStyle = '#94a3b8'; // slate-400
            hCtx.fillRect(0, 0, 16, 16);
            
            // Stripes
            hCtx.strokeStyle = '#64748b'; // slate-500
            hCtx.lineWidth = 3;
            hCtx.beginPath();
            hCtx.moveTo(0, 16); hCtx.lineTo(16, 0);
            hCtx.moveTo(-8, 8); hCtx.lineTo(8, -8);
            hCtx.moveTo(8, 24); hCtx.lineTo(24, 8);
            hCtx.stroke();
            
            return ctx.createPattern(hatchCanvas, 'repeat');
        }
        let hatchPattern;

        function drawTerrain() {
            if (!hatchPattern) hatchPattern = createHatchPattern();
            
            // Helper to draw grid-aligned blocks
            const drawHurdle = (cx, cy, w, h) => {
                const pt = getPx(cx, cy + h); // Top-left corner for canvas drawing
                
                ctx.fillStyle = hatchPattern;
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                // Adding a slight border radius to the terrain for that Nintendo feel
                ctx.roundRect(pt.x, pt.y, w * CELL_SIZE, h * CELL_SIZE, [4]);
                ctx.fill();
                ctx.stroke();
                
                // Add a bright top-edge highlight for 3D pop
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(pt.x + 2, pt.y + 2);
                ctx.lineTo(pt.x + (w * CELL_SIZE) - 2, pt.y + 2);
                ctx.stroke();
            };

            // Ground Layout
            drawHurdle(0, 0, 6, 4);   // Left tower
            drawHurdle(6, 0, 2, 2);   // Left step
            drawHurdle(10, 0, 2, 2);  // Right step
            drawHurdle(12, 0, 4, 4);  // Right tower

            // The Glowing Landing Target
            ctx.save();
            const targetCenter = getPx(9, 3);
            ctx.translate(targetCenter.x, targetCenter.y);
            
            // Pulse opacity based on time
            const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 300);
            
            // Draw Inverse T shape outline
            ctx.fillStyle = `rgba(34, 197, 94, ${0.15 * pulse})`; // Emerald tint
            ctx.strokeStyle = `rgba(34, 197, 94, ${0.8 * pulse})`; // Emerald border
            ctx.setLineDash([8, 6]);
            ctx.lineWidth = 4;
            
            // The Target blocks are rotated 180 (so D is down, A left, C right)
            const targetBlocks = [
                {x: 0, y: 0}, // B
                {x: -2, y: 0}, // A
                {x: 2, y: 0},  // C
                {x: 0, y: -2}  // D
            ];

            ctx.beginPath();
            targetBlocks.forEach(b => {
                // Adjust drawing origin to top-left of the 2x2 block cell
                const blockPxX = (b.x - 1) * CELL_SIZE; 
                const blockPxY = (-b.y - 1) * CELL_SIZE; 
                ctx.roundRect(blockPxX, blockPxY, CELL_SIZE * 2, CELL_SIZE * 2, [6]);
            });
            ctx.fill();
            ctx.stroke();

            // "LANDING GAP" Text inside target
            ctx.setLineDash([]);
            ctx.fillStyle = '#16a34a'; // Dark green text
            ctx.font = '900 16px "Nunito", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; // White outline
            // Place below center
            ctx.strokeText("LANDING GAP", 0, CELL_SIZE * 1.5);
            ctx.fillText("LANDING GAP", 0, CELL_SIZE * 1.5);

            ctx.restore();
        }

        function drawPath() {
            if (pathHistory.length < 2 && !isAnimating) return;
            
            ctx.save();
            ctx.strokeStyle = '#f59e0b'; // Amber path (matches pivot color)
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 10]);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Glowing trail effect
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            
            ctx.beginPath();
            pathHistory.forEach((pt, index) => {
                const px = getPx(pt.x, pt.y);
                if (index === 0) ctx.moveTo(px.x, px.y);
                else ctx.lineTo(px.x, px.y);
            });

            // Draw current animated line
            if (isAnimating && (startState.x !== targetState.x || startState.y !== targetState.y)) {
                const px = getPx(state.x, state.y);
                ctx.lineTo(px.x, px.y);
            }
            
            ctx.stroke();
            ctx.restore();
        }

        function drawTetromino() {
            ctx.save();
            const center = getPx(state.x, state.y);
            ctx.translate(center.x, center.y);
            
            // Apply main rotation
            ctx.rotate(state.angle * Math.PI / 180);

            // Group Drop Shadow for the whole shape
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 8;

            BLOCKS.forEach(b => {
                const isPivot = (b.id === 'B');
                const blockPxX = (b.x - 1) * CELL_SIZE; // -1 to shift from center of 2x2 to left edge
                const blockPxY = (-b.y - 1) * CELL_SIZE; // -1 to shift from center to top edge
                const size = CELL_SIZE * 2;

                // Base Fill & Stroke
                ctx.beginPath();
                ctx.roundRect(blockPxX, blockPxY, size, size, [8]);
                
                if (isPivot) {
                    ctx.fillStyle = '#fbbf24'; // amber-400
                    ctx.strokeStyle = '#d97706'; // amber-600
                } else {
                    ctx.fillStyle = '#38bdf8'; // sky-400
                    ctx.strokeStyle = '#0284c7'; // sky-600
                }
                
                ctx.lineWidth = 4;
                ctx.fill();
                ctx.stroke();

                // Clear shadow for internal details
                ctx.shadowColor = 'transparent';

                // Inner Highlight (Bevel effect)
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(blockPxX + 4, blockPxY + 4, size - 8, size - 8, [4]);
                ctx.stroke();

                // Sub-grid center cross (Faint)
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(blockPxX + CELL_SIZE, blockPxY + 4); ctx.lineTo(blockPxX + CELL_SIZE, blockPxY + size - 4);
                ctx.moveTo(blockPxX + 4, blockPxY + CELL_SIZE); ctx.lineTo(blockPxX + size - 4, blockPxY + CELL_SIZE);
                ctx.stroke();

                // Label and Decorations
                ctx.save();
                ctx.translate(blockPxX + CELL_SIZE, blockPxY + CELL_SIZE);
                
                // Keep text upright by counter-rotating
                ctx.rotate(-state.angle * Math.PI / 180);
                
                if (isPivot) {
                    // Draw mechanical gear/screw head for the pivot
                    ctx.beginPath();
                    ctx.arc(0, 0, 16, 0, Math.PI*2);
                    ctx.fillStyle = '#b45309';
                    ctx.fill();
                    // Screw slot
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-8, -8); ctx.lineTo(8, 8);
                    ctx.moveTo(-8, 8); ctx.lineTo(8, -8);
                    ctx.stroke();
                } else {
                    // Normal block label backdrop
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI*2);
                    ctx.fillStyle = '#0369a1';
                    ctx.fill();
                }

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 16px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Adjust text position slightly for optical centering
                ctx.fillText(b.id, 0, 2); 
                
                ctx.restore();
                
                // Restore shadow for next block loop
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            });

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('ui-coords').innerText = `(${state.x.toFixed(1)}, ${state.y.toFixed(1)})`;
            document.getElementById('ui-timer').innerText = `${state.time.toFixed(1)}s`;
        }

        function render() {
            drawGrid();
            drawTerrain();
            drawPath();
            drawTetromino();
            updateUI();
        }

        function animate() {
            if (!isAnimating) {
                // Keep rendering slowly to allow target pulsing animation
                render();
                requestAnimationFrame(animate);
                return;
            }

            // Calculate progress speed based on distance/time to make it feel natural
            // Normal steps take about 1.5 seconds real time, regardless of sim time
            animProgress += 0.012; 
            
            let t = Math.min(animProgress, 1);
            let easedT = easeInOutCubic(t);

            // Interpolate state
            state.x = lerp(startState.x, targetState.x, easedT);
            state.y = lerp(startState.y, targetState.y, easedT);
            state.angle = lerp(startState.angle, targetState.angle, easedT);
            state.time = lerp(startState.time, targetState.time, easedT);

            render();

            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                // Animation completed
                isAnimating = false;
                
                // Save path node if a translation happened
                if (startState.x !== targetState.x || startState.y !== targetState.y) {
                    pathHistory.push({x: state.x, y: state.y});
                }
                
                startState = { ...state };
                updateButtonStates();
                
                // Handle Auto Play chaining
                if (isAutoPlaying && currentSequence < 3) {
                    setTimeout(() => {
                        triggerStep(currentSequence + 1);
                    }, 500); // 500ms pause between auto steps
                } else {
                    isAutoPlaying = false;
                }
                
                requestAnimationFrame(animate); // Keep loop alive
            }
        }

        let isAutoPlaying = false;

        function triggerStep(step) {
            if (isAnimating) return;
            
            currentSequence = step;
            animProgress = 0;
            startState = { ...state };
            
            // Set visuals for active button
            document.getElementById(`btn-step${step}`).classList.replace('btn-blue', 'btn-green');

            if (step === 1) {
                targetState.x = 9;   // T(+5, 0)
                targetState.time += 5; // 5 seconds penalty
            } 
            else if (step === 2) {
                targetState.angle = 180; // Rotate 180
                targetState.time += 2;   // 2 seconds penalty (two 90deg turns)
            } 
            else if (step === 3) {
                targetState.y = 3;       // T(0, -9)
                targetState.time += 9;   // 9 seconds penalty
            }

            isAnimating = true;
        }

        function updateButtonStates() {
            const b1 = document.getElementById('btn-step1');
            const b2 = document.getElementById('btn-step2');
            const b3 = document.getElementById('btn-step3');

            // Reset colors
            [b1, b2, b3].forEach(b => {
                b.classList.remove('btn-green');
                b.classList.add('btn-blue');
            });

            if (currentSequence === 1) {
                b1.disabled = true; b2.disabled = false; b3.disabled = true;
            } else if (currentSequence === 2) {
                b1.disabled = true; b2.disabled = true; b3.disabled = false;
            } else if (currentSequence === 3) {
                b1.disabled = true; b2.disabled = true; b3.disabled = true;
                // Game finished, make auto play button look disabled
                document.getElementById('btn-auto').disabled = true;
            } else {
                // Initial State
                b1.disabled = false; b2.disabled = true; b3.disabled = true;
                document.getElementById('btn-auto').disabled = false;
            }
        }

        // Bind Events
        document.getElementById('btn-step1').addEventListener('click', () => triggerStep(1));
        document.getElementById('btn-step2').addEventListener('click', () => triggerStep(2));
        document.getElementById('btn-step3').addEventListener('click', () => triggerStep(3));

        document.getElementById('btn-auto').addEventListener('click', () => {
            if (isAnimating || currentSequence >= 3) return;
            isAutoPlaying = true;
            
            // Start from where we are, or step 1 if at beginning
            const nextStep = currentSequence === 0 ? 1 : currentSequence + 1;
            triggerStep(nextStep);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isAnimating = false;
            isAutoPlaying = false;
            
            // Reset state
            state = { x: 4, y: 12, angle: 0, time: 0 };
            startState = { ...state };
            targetState = { ...state };
            pathHistory = [{x: 4, y: 12}];
            currentSequence = 0;
            animProgress = 0;
            
            updateButtonStates();
            render();
        });

        // Initialization
        window.onload = () => {
            setTimeout(() => {
                resizeCanvas();
                requestAnimationFrame(animate);
            }, 100); // Tiny delay to ensure fonts/layout shift is done
        };

    </script>
</body>
</html>
